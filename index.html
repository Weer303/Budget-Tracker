<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="../basic.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-4xl mx-auto">

  <header class="mb-8 border-b border-emerald-900/60 pb-5 text-center md:text-left">
    <div>
      <h1 class="text-3xl font-extrabold text-emerald-400 tracking-tight">ระบบบันทึกรายรับ-รายจ่าย</h1>
      <p class="text-gray-400 text-sm mt-1">Budget Tracker</p>
    </div>
  </header>

  <section class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-8 shadow-xl">
    <h2 class="text-lg font-bold mb-5 text-emerald-400 border-b border-gray-800 pb-3">
      เพิ่มรายการใหม่
    </h2>
    <form id="budgetForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label for="title" class="block text-sm font-medium text-gray-300 mb-1.5">  ชื่อรายการ</label>
        <input type="text" id="title" required maxlength="50" 
               class="w-full bg-gray-950 border border-gray-700 text-gray-100 rounded-lg p-2.5 transition">
      </div>

      <div>
        <label for="amount" class="block text-sm font-medium text-gray-300 mb-1.5">  จำนวนเงิน</label>
        <input type="number" id="amount" required min="1" step="any" 
               class="w-full bg-gray-950 border border-gray-700 text-gray-100 rounded-lg p-2.5 transition">
      </div>

      <div>
        <label for="date" class="block text-sm font-medium text-gray-300 mb-1.5">  วันที่</label>
        <input type="date" id="date" required 
               class="w-full bg-gray-950 border border-gray-700 text-gray-100 rounded-lg p-2.5 transition">
      </div>

      <div>
        <label for="time" class="block text-sm font-medium text-gray-300 mb-1.5">  เวลา</label>
        <input type="time" id="time" required 
               class="w-full bg-gray-950 border border-gray-700 text-gray-100 rounded-lg p-2.5 transition">
      </div>

      <div class="md:col-span-2">
        <label for="type" class="block text-sm font-medium text-gray-300 mb-1.5">  ประเภทรายการ</label>
        <select id="type" required class="w-full bg-gray-950 border border-gray-700 text-gray-100 rounded-lg p-2.5 transition">
          <option value="income"> รายรับ</option>
          <option value="expense"> รายจ่าย</option>
        </select>
      </div>

      <div class="md:col-span-2 flex gap-4 pt-3">
        <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg shadow-emerald-900/40 transition active:scale-[0.99]">
          บันทึกรายการ
        </button>
        <button type="reset" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-2.5 px-4 rounded-lg transition">
          ยกเลิก
        </button>
      </div>
    </form>
  </section>

  <section class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
    <h2 class="text-lg font-bold mb-4 text-emerald-400 border-b border-gray-800 pb-3">
      รายการบันทึกทั้งหมด
    </h2>
    <ul id="itemList" class="divide-y divide-gray-800/80">
    </ul>
  </section>

  <script>
    const form = document.getElementById("budgetForm");
    const titleInput = document.getElementById("title");
    const amountInput = document.getElementById("amount");
    const dateInput = document.getElementById("date");
    const timeInput = document.getElementById("time");
    const typeSelect = document.getElementById("type");
    const itemList = document.getElementById("itemList");

    console.log("Initialized Form Elements:", { form, titleInput, amountInput, dateInput, timeInput, typeSelect });

    let transactions = [
      { id: 1, title: "เงินค่าขนม", amount: 1000, date: "2026-08-19", time: "08:00", type: "income" },
      { id: 2, title: "ค่าอาหารกลางวัน", amount: 150, date: "2026-08-19", time: "12:30", type: "expense" },
      { id: 3, title: "ค่าเดินทาง", amount: 50, date: "2026-08-19", time: "18:00", type: "expense" },
      { id: 4, title: "รับจ้างทั่วไป", amount: 500, date: "2026-08-20", time: "10:00", type: "income" },
      { id: 5, title: "ซื้ออุปกรณ์การเรียน", amount: 120, date: "2026-08-20", time: "14:00", type: "expense" }
    ];

    console.log("Initial Transactions Array:", transactions);

    async function loadInitialData() {
      try {
        const response = await fetch('./budgetfrom.json');
        const data = await response.json();
        if (data.transactions && data.transactions.length > 0) {
          transactions = data.transactions;
          console.log("Loaded Data from budgetfrom.json successfully:", transactions);
        }
      } catch (error) {
        console.warn("Could not load budgetfrom.json, falling back to default JS Array.", error);
      }
      renderList();
    }

    function updateSummary() {
      const totalIncome = transactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const totalExpense = transactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + Number(t.amount), 0);

      const netBalance = totalIncome - totalExpense;

      console.log("Summary Calculations:");
      console.log(" - Total Income:", totalIncome);
      console.log(" - Total Expense:", totalExpense);
      console.log(" - Net Balance:", netBalance);
    }

    function renderList() {
      itemList.innerHTML = '';

      if (transactions.length === 0) {
        itemList.innerHTML = '<li class="py-6 text-center text-gray-500">ยังไม่มีรายการบันทึก</li>';
        updateSummary();
        return;
      }

      transactions.forEach(item => {
        const li = document.createElement('li');
        li.className = 'py-3.5 flex justify-between items-center hover:bg-gray-800/40 px-2 rounded-lg transition';
        
        const isIncome = item.type === 'income';
        const badgeStyle = isIncome 
          ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/60' 
          : 'bg-rose-950/80 text-rose-400 border border-rose-800/60';
        const amountPrefix = isIncome ? '+' : '-';
        
        li.innerHTML = `
          <div>
            <div class="flex items-center gap-2.5">
              <span class="font-medium text-gray-200">${item.title}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${badgeStyle}">
                ${isIncome ? 'รายรับ' : 'รายจ่าย'}
              </span>
            </div>
            <div class="text-xs text-gray-500 mt-1">${item.date} | ${item.time}</div>
          </div>
          <div class="flex items-center gap-4">
            <span class="font-bold text-base ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
              ${amountPrefix}${Number(item.amount).toLocaleString()} บาท
            </span>
            <button onclick="deleteItem(${item.id})" 
                    class="bg-gray-800 hover:bg-rose-900/60 text-gray-400 hover:text-rose-300 border border-gray-700 hover:border-rose-700/50 text-xs px-2.5 py-1 rounded-md transition">
              ลบ
            </button>
          </div>
        `;
        itemList.appendChild(li);
      });

      updateSummary();
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const title = titleInput.value.trim();
      const price = Number(amountInput.value);
      const date = dateInput.value;
      const time = timeInput.value;
      const type = typeSelect.value;

      console.log("--- Form Submitted ---");
      console.log("Item Title:", title);
      console.log("Amount:", price);

      if (price <= 0 || isNaN(price)) {
        console.warn("Validation Failed: Invalid amount ->", price);
        alert("กรุณากรอกจำนวนเงินให้ถูกต้อง (ต้องมากกว่า 0)");
        return;
      }

      const newTransaction = {
        id: Date.now(),
        title: title,
        amount: price,
        date: date,
        time: time,
        type: type
      };

      console.log("Created New Transaction Object:", newTransaction);
      transactions.push(newTransaction);
      console.log("Updated Transactions Array:", transactions);

      form.reset();
      renderList();
    });

    function deleteItem(id) {
      console.log("Deleting Item ID:", id);
      transactions = transactions.filter(item => item.id !== id);
      console.log("Array After Deletion:", transactions);
      renderList();
    }

    loadInitialData();
  </script>
</body>
</html>
